name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # The Rust version and the wasm target come from rust-toolchain.toml at the
      # repo root, so CI compiles with the same toolchain as contributors.
      # `rustup toolchain install` with no argument installs the active
      # (pinned) toolchain together with the targets listed there. Do not
      # replace this with a floating `stable` toolchain.
      - name: Install Rust
        run: rustup toolchain install
      - name: Show toolchain
        run: rustc --version --verbose
      - name: Run tests
        run: cargo test
      # Soroban contracts must be built by the Stellar CLI: it runs the SDK's
      # spec shaking step, and soroban-sdk 28 refuses to build for a wasm target
      # when the build system does not support it. Pinned to the soroban-sdk major.
      - name: Install Stellar CLI
        run: |
          curl -sSL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version
      - name: Build contracts to Wasm
        run: stellar contract build
